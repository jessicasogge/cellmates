<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CellMates: A Virology Game</title>
    <meta name="description" content="A free virology game you play in your browser: pick a virus, infect cells to make copies of her and dodge the disks. The sister game to PetriPals and FunGals." />
    <link rel="canonical" href="https://jessicasogge.github.io/cellmates/" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- The mates, drawn by script.js from game/mates.js -->
    <div class="friends"></div>

    <h1 class="logo">CellMates</h1>
    <p class="tagline">Infect cells. Make plaques. Dodge the disks.</p>
    <button class="start-btn" type="button">Press Start to Play</button>
    <p class="about">
      Pick a real virus, drawn as a cartoon. Viruses can't grow on their own,
      so infect cells to make copies of her, and steer clear of the disks.
      The sister game to <a href="https://jessicasogge.github.io/petripals/">PetriPals</a>
      and <a href="https://jessicasogge.github.io/fungals/">FunGals</a>.
    </p>
    <footer class="signature">jsogge 2026</footer>
    <script type="module" src="./script.js"></script>
    <script data-goatcounter="https://petripals.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>
